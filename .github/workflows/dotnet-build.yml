name: Build e Execução do WebApp .NET

on:
  push:  # Quando houver push
  schedule:
    - cron: '0 * * * *'  # A cada hora (UTC)

jobs:
  setup-e-executa:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3  # 🔁 Action pré-existente

      - name: Instalar o SDK .NET
        uses: actions/setup-dotnet@v3  # 🔁 Action pré-existente
        with:
          dotnet-version: '8.0.x'

      - name: Criar projeto webapp (script personalizado)
        run: dotnet new webapp -n github4women

      - name: Restaurar dependências
        run: dotnet restore **/*.csproj

      - name: Compilar projeto
        run: dotnet build **/*.csproj --no-restore

      - name: Executar aplicação
        run: dotnet run --project **/*.csproj --urls "http://localhost:5050"
